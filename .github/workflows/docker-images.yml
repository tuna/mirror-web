name: docker-images

on:
  push:
    branches:
      - master
      - docker-test
  pull_request:
    branches:
      - master
      - docker-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: ubuntu-latest
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner.name }}
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prevent loading RubyGems from TUNA
        run: |
          sed -i "/^source/c source 'https://rubygems.org'" Gemfile
          sed -i '/remote:/s@remote: .*$@remote: https://rubygems.org@' Gemfile.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tunathu/mirror-web
          labels: |
            org.opencontainers.image.title=mirror-web
            org.opencontainers.image.description=Build environment for the TUNA mirror website
            org.opencontainers.image.vendor=Tsinghua University TUNA Association
          annotations: |
            org.opencontainers.image.title=mirror-web
            org.opencontainers.image.description=Build environment for the TUNA mirror website
            org.opencontainers.image.vendor=Tsinghua University TUNA Association

      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build
          platforms: ${{ matrix.runner.platform }}
          load: true
          tags: tunathu/mirror-web:localtest
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=mirror-web-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=mirror-web-${{ runner.arch }}

      - name: Test page build
        run: |
          docker run --rm \
            --volume "$PWD:/data" \
            --volume "$PWD/_site:/data/_site" \
            --tmpfs /data/.jekyll-cache \
            --tmpfs /data/node_modules:exec \
            --env VISUALIZER=1 \
            tunathu/mirror-web:localtest \
            bash -c "npm ci --include=dev && bundle exec jekyll build --future"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ runner.arch }}
          path: _site

      - name: Upload build statistics
        uses: actions/upload-artifact@v7
        with:
          name: stats.html-${{ runner.arch }}
          path: _stats.html

      - name: Build and push by digest
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          file: Dockerfile.build
          platforms: ${{ matrix.runner.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: tunathu/mirror-web
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=mirror-web-${{ runner.arch }}
          outputs: ${{ github.event_name == 'push' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=image' }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - multi
    if: github.event_name == 'push' && needs.multi.result == 'success'
    steps:
      - name: Determine Docker tag
        id: docker_tag
        env:
          TAG_NAME: ${{ github.ref }}
        run: |
          case "$TAG_NAME" in
            refs/heads/master)
              tag=latest
              ;;
            refs/tags/*)
              tag=${TAG_NAME#refs/tags/}
              ;;
            refs/heads/*)
              tag=branch-${TAG_NAME#refs/heads/}
              ;;
            *)
              tag=dummy
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          source_url="${{ github.server_url }}/${{ github.repository }}"
          version="${{ steps.docker_tag.outputs.tag }}"
          sources=()

          while IFS= read -r digest; do
            sources+=("tunathu/mirror-web@sha256:$digest")
          done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)

          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create -t "tunathu/mirror-web:$version" \
            --annotation "index:org.opencontainers.image.created=$created" \
            --annotation "index:org.opencontainers.image.description=Build environment for the TUNA mirror website" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.source=$source_url" \
            --annotation "index:org.opencontainers.image.title=mirror-web" \
            --annotation "index:org.opencontainers.image.url=$source_url" \
            --annotation "index:org.opencontainers.image.vendor=Tsinghua University TUNA Association" \
            --annotation "index:org.opencontainers.image.version=$version" \
            "${sources[@]}"

      - name: Inspect published image
        run: |
          ref="tunathu/mirror-web:${{ steps.docker_tag.outputs.tag }}"
          echo "## $ref" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$ref" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '| Platform | Compressed size | Digest |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | --- |' >> "$GITHUB_STEP_SUMMARY"

          index_json="$(docker buildx imagetools inspect "$ref" --raw)"
          while IFS=$'\t' read -r platform digest; do
            manifest_json="$(docker buildx imagetools inspect "tunathu/mirror-web@$digest" --raw)"
            size_bytes="$(jq '[.layers[]?.size] | add // 0' <<< "$manifest_json")"
            size="$(numfmt --to=iec-i --suffix=B --format='%.1f' "$size_bytes")"
            printf '| `%s` | %s | `%s` |\n' "$platform" "$size" "$digest" \
              >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.manifests[] | select(.platform.os != "unknown") | [(.platform.os + "/" + .platform.architecture), .digest] | @tsv' <<< "$index_json")
